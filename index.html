
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09090e">
<title>Ryzer — Personal Space</title>
<style>
:root{--bg:#09090e;--panel:#14141e;--text:#f4f3fa;--muted:#9998ac;--lime:#c7ff55;--purple:#a78bfa}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 15px;color:var(--text);background:radial-gradient(ellipse at 10% 5%,#39224b66,transparent 40%),radial-gradient(ellipse at 90% 90%,#263b1d55,transparent 40%),var(--bg);font-family:system-ui,-apple-system,sans-serif}
.page{width:100%;max-width:680px}
.top{display:flex;justify-content:space-between;margin-bottom:16px;color:var(--muted);font-size:11px;letter-spacing:2px}
.online{color:var(--lime)}
.online:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--lime);margin-right:7px}
.card{padding:26px;background:linear-gradient(145deg,#191923,#101016);border:1px solid #ffffff14;border-radius:25px;box-shadow:0 25px 90px #0008}
.profile{display:flex;align-items:center;gap:18px}
.avatar{width:94px;height:94px;object-fit:cover;border-radius:23px;border:1px solid #c7ff5577;box-shadow:0 0 28px #c7ff5520;background:#222}
h1{margin:0 0 5px;font-size:42px;letter-spacing:-2px}
.handle{color:var(--muted);font-size:13px}
.badge{display:inline-block;margin-top:10px;padding:5px 9px;border-radius:7px;background:#c7ff5512;border:1px solid #c7ff5533;color:var(--lime);font-size:10px;letter-spacing:1px}
.bio{margin:25px 0 18px;line-height:1.7;color:#d1d0df}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border:1px solid #ffffff14;border-radius:10px;color:#deddea;font-size:12px;background:#ffffff04}
.heading{display:flex;align-items:center;gap:10px;margin:28px 0 13px;color:var(--muted);font-size:11px;letter-spacing:2px}
.heading:after{content:"";height:1px;flex:1;background:#ffffff16}
.music{padding:16px;border:1px solid #a78bfa38;background:linear-gradient(110deg,#a78bfa12,#c7ff5508);border-radius:16px}
.track{display:flex;align-items:center;gap:12px}
.cover{width:48px;height:48px;display:grid;place-items:center;flex-shrink:0;border-radius:13px;background:linear-gradient(135deg,#a78bfa,#c7ff55);color:#111;font-size:22px}
.info{flex:1;min-width:0}
.name{font-weight:750;font-size:14px}
.artist{margin-top:4px;color:var(--muted);font-size:12px}
.play{width:43px;height:43px;border:0;border-radius:50%;background:var(--lime);color:#111;font-size:17px;font-weight:bold}
.progress{width:100%;margin:17px 0 8px;accent-color:var(--lime)}
.times{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}
.social{display:flex;align-items:center;gap:13px;padding:15px;border:1px solid #ffffff14;border-radius:14px;background:#ffffff04}
.social-icon{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:#a78bfa18;color:var(--purple);font-size:20px}
.social strong,.social small{display:block}
.social strong{font-size:14px}
.social small{margin-top:4px;color:var(--muted)}
.arrow{margin-left:auto;color:var(--muted)}
a{color:inherit;text-decoration:none}
.footer{text-align:center;margin-top:18px;color:#737286;font-size:10px;letter-spacing:1px}
.footer span{color:var(--lime)}
@media(max-width:420px){.card{padding:20px}.avatar{width:78px;height:78px}h1{font-size:35px}}
</style>
</head>
<body>
<main class="page">
<div class="top"><span>PERSONAL SPACE / 001</span><span class="online">ONLINE</span></div>
<section class="card">
<header class="profile">
<img class="avatar" src="./avatar.jpg" alt="Ryzer avatar">
<div>
<h1>Ryzer<span style="color:var(--lime)">.</span></h1>
<div class="handle">@noryzer · digital player</div>
<span class="badge">✦ PERSONAL PAGE</span>
</div>
</header>
<p class="bio">15 yo, genius, philanthropist.</p>
<div class="chips">
<span class="chip">⌕ OSINT</span>
<span class="chip">◈ SNOS</span>
<span class="chip">✦ Vibecoder</span>
</div>
<div class="heading">NOW PLAYING</div>
<section class="music">
<div class="track">
<div class="cover">♫</div>
<div class="info"><div class="name">L'OREAL PARIS</div><div class="artist">dexey</div></div>
<button class="play" id="play" aria-label="Play">▶</button>
</div>
<input class="progress" id="progress" type="range" min="0" max="100" value="0" step="0.1" aria-label="Track progress">
<div class="times"><span id="current">0:00</span><span id="duration">0:00</span></div>
<audio id="audio" preload="metadata" src="./music.mp3"></audio>
</section>
<div class="heading">FIND ME</div>
<a class="social" href="https://t.me/NoRyzer" target="_blank" rel="noopener noreferrer">
<span class="social-icon">↗</span><span><strong>Telegram</strong><small>@NoRyzer</small></span><span class="arrow">↗</span>
</a>
</section>
<footer class="footer">DESIGNED FOR <span>RYZER</span> · STAY DIFFERENT</footer>
</main>
<script>
const audio=document.getElementById('audio');
const play=document.getElementById('play');
const progress=document.getElementById('progress');
const current=document.getElementById('current');
const duration=document.getElementById('duration');
function fmt(n){if(!Number.isFinite(n))return'0:00';return Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0')}
play.addEventListener('click',async()=>{if(audio.paused){try{await audio.play()}catch(e){alert('Не найден music.mp3. Загрузи трек в репозиторий.')}}else audio.pause()});
audio.addEventListener('play',()=>play.textContent='Ⅱ');
audio.addEventListener('pause',()=>play.textContent='▶');
audio.addEventListener('loadedmetadata',()=>duration.textContent=fmt(audio.duration));
audio.addEventListener('timeupdate',()=>{current.textContent=fmt(audio.currentTime);if(audio.duration)progress.value=audio.currentTime/audio.duration*100});
progress.addEventListener('input',()=>{if(audio.duration)audio.currentTime=progress.value/100*audio.duration});
</script>
</body>
</html>
